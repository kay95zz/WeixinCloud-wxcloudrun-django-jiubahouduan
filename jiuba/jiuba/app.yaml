# 如果是 app.yaml，添加健康检查配置
services:
  - name: django-98
    ports:
      - containerPort: 80
        protocol: TCP
    livenessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 60  # 重要！给Django足够的时间启动
      periodSeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5